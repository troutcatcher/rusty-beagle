[package]
name = "rusty-beagle"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A fast Rust port of Beagle 5.5 genotype imputation"

[[bin]]
name = "rusty-beagle"
path = "src/main.rs"

[dependencies]
flate2 = "1"
rayon = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
